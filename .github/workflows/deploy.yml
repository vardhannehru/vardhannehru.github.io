# Builds the site and publishes it to GitHub Pages (https://vardhannehru.github.io) on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Full address for the link-preview tags in index.html.
          SITE_URL: https://vardhannehru.github.io
      # GitHub Pages can't send every path to index.html, so opening or refreshing /work, /about etc. would 404.
      # Its 404 page is served for unknown paths, so make that the site itself: the app then shows the right page
      # (or its own "page not found").
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
