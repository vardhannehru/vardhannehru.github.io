    <script>
      // Theme before first paint: the pastel theme (lavender, green, yellow) unless the visitor picked the dark one.
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme-v2'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <!-- Tailwind CDN is OK for now, but it must not block app boot.
         Use defer so React can mount even if CDN is slow/unavailable.
         IMPORTANT: configure darkMode='class' so `dark:` variants work. -->
    <script>
      // Tailwind CDN config (must exist before the CDN script runs)
      window.tailwind = window.tailwind || {};
      window.tailwind.config = { darkMode: 'class' };
    </script>
    <!-- The CDN replaces any config set before it loads, so set darkMode again once it has (otherwise
         `dark:` styles follow the device setting instead of the site's light/dark switch). -->
    <script src="https://cdn.tailwindcss.com" defer onload="tailwind.config = { darkMode: 'class' }"></script>

<style>
  html {
    scroll-behavior: smooth;
  }
  /* The TV glow's colour (WorkSection.tsx), registered so it can fade between channels inside a gradient. */
  @property --tv-glow {
    syntax: '<color>';
    inherits: false;
    initial-value: transparent;
  }
  /* Lenis drives the scroll itself; the browser's own smoothing on top of it makes it stutter. */
  html.lenis, html.lenis body { height: auto; }
  html.lenis { scroll-behavior: auto !important; }
  .lenis.lenis-stopped { overflow: clip; }
  .lenis [data-lenis-prevent] { overscroll-behavior: contain; }
  .lenis.lenis-smooth iframe { pointer-events: none; }
  /* The traffic-light pole is the page's scrollbar (components/signal/TrafficLight.tsx): while it's on, the
     browser's own scrollbar is hidden. The page still scrolls exactly as before. */
  html.signal-scrollbar { scrollbar-width: none; }
  html.signal-scrollbar::-webkit-scrollbar, html.signal-scrollbar body::-webkit-scrollbar { display: none; width: 0; height: 0; }
  
  body {
    font-family: 'Inter', 'Geist Sans', sans-serif;
    /* Dark-first to avoid any flash on refresh/navigation */
    background: #07040f;
    color-scheme: dark;
  }

  html.dark body {
    background: #07040f;
  }

  :root {
    --separator-color: #d1d5db; /* gray-300 */
  }

  html.dark {
    --separator-color: #b69df8;
  }

  @keyframes fade-in-down {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  @keyframes fade-in-up {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  .animate-fade-in-down {
    animation: fade-in-down 0.8s ease-out forwards;
  }
  
  .animate-fade-in-up {
    animation: fade-in-up 0.8s ease-out forwards;
    opacity: 0;
  }
  
  .animation-delay-200 {
    animation-delay: 0.2s;
  }
  
  .animation-delay-400 {
    animation-delay: 0.4s;
  }
  
  .animation-delay-600 {
    animation-delay: 0.6s;
  }
  
  .animation-delay-800 {
    animation-delay: 0.8s;
  }
  
  @keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  
  .animate-gradient {
    background-size: 200% 200%;
    animation: gradient-shift 3s ease infinite;
  }

  @keyframes shine {
    from {
      background-position: 200% 0;
    }
    to {
      background-position: -200% 0;
    }
  }
  
  .animate-shine {
    animation: shine 3s linear infinite;
  }

  @keyframes scroll {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(-50%);
    }
  }

  .scroll-container {
    animation: scroll linear infinite;
    will-change: transform;
  }

  .scroll-text-item:not(:last-child)::after {
    content: '•';
    margin-left: 1.5rem; /* Corresponds to mx-6 in Tailwind */
    font-weight: bold;
    color: var(--separator-color);
  }

  @keyframes sdb06 {
    0% {
      transform: rotateY(0) rotateZ(-45deg) translate(0, 0);
      opacity: 0;
    }
    50% {
      opacity: 1;
    }
    100% {
      transform: rotateY(720deg) rotateZ(-45deg) translate(-20px, 20px);
      opacity: 0;
    }
  }

  .animate-sdb06 {
    animation: sdb06 1.5s infinite;
  }

  @keyframes confetti-pop {
    0% {
      transform: translate(var(--x-start), var(--y-start)) rotate(var(--rotation-start)) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--x-end), var(--y-end)) rotate(var(--rotation-end)) scale(var(--scale-end));
      opacity: 0;
    }
  }

  /* Seasonal effects */
  .seasonal-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  .snowflake {
    position: absolute;
    top: -10vh;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.85);
    animation: snow-fall var(--snow-duration, 10s) linear var(--snow-delay, 0s) infinite;
    will-change: transform;
  }

  @keyframes snow-fall {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg);
    }
    50% {
      transform:
        translate3d(
          calc((var(--snow-drift, 0vw) * 0.5) + var(--snow-sway, 10vw)),
          60vh,
          0
        )
        rotate(calc(var(--snow-spin, 10deg) * 0.5));
    }
    100% {
      transform: translate3d(var(--snow-drift, 0vw), 120vh, 0) rotate(var(--snow-spin, 10deg));
    }
  }

  /* Monsoon */
  .raindrop {
    position: absolute;
    top: -15vh;
    width: 2px;
    background: linear-gradient(to bottom, rgba(160, 220, 255, 0.0), rgba(160, 220, 255, 0.8));
    border-radius: 9999px;
    animation: rain-fall var(--rain-duration, 1s) linear var(--rain-delay, 0s) infinite;
    will-change: transform;
  }

  @keyframes rain-fall {
    0% {
      transform: translate3d(0, 0, 0) skewX(-12deg);
    }
    50% {
      transform:
        translate3d(
          calc((var(--rain-drift, -6vw) * 0.5) + var(--rain-sway, 2vw)),
          65vh,
          0
        )
        skewX(-12deg);
    }
    100% {
      transform: translate3d(var(--rain-drift, -6vw), 130vh, 0) skewX(-12deg);
    }
  }

  /* Autumn leaves */
  .leaf {
    position: absolute;
    top: -12vh;
    border-radius: 9999px 9999px 9999px 0;
    background: rgba(182,157,248, 0.28);
    animation: leaf-fall var(--leaf-duration, 12s) ease-in-out var(--leaf-delay, 0s) infinite;
    will-change: transform;
  }

  @keyframes leaf-fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(var(--leaf-drift, 0vw), 125vh, 0) rotate(520deg); }
  }

  /* Spring petals */
  .petal {
    position: absolute;
    top: -12vh;
    border-radius: 9999px 9999px 9999px 9999px;
    background: rgba(196, 181, 253, 0.20);
    animation: petal-fall var(--petal-duration, 12s) ease-in-out var(--petal-delay, 0s) infinite;
    will-change: transform;
  }

  @keyframes petal-fall {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(var(--petal-drift, 0vw), 125vh, 0) rotate(420deg); }
  }

  /* Summer heat haze (very subtle) */
  .heat-haze {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 45;
    background:
      radial-gradient(60% 50% at 30% 20%, rgba(255, 255, 255, 0.04), transparent 60%),
      radial-gradient(50% 40% at 70% 40%, rgba(255, 255, 255, 0.03), transparent 65%);
    mix-blend-mode: overlay;
    animation: haze 5s ease-in-out infinite;
  }

  @keyframes haze {
    0% { transform: translate3d(-1vw, -0.5vh, 0); }
    50% { transform: translate3d(1vw, 0.5vh, 0); }
    100% { transform: translate3d(-1vw, -0.5vh, 0); }
  }

  /* Wind overlay removed: snow now carries the breeze motion itself. */
  
  body.hide-smooth-cursor .smooth-cursor {
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  /* Over the Work section the cursor is the 3D TV remote (RemoteCursor.tsx), so the dot hides. */
  .smooth-cursor { transition: opacity 0.2s ease; }
  body.remote-cursor-on .smooth-cursor { opacity: 0; }
  /* Over the About section the cursor is the 3D pencil (components/about/pencil/PencilCursor.tsx). */
  body.pencil-cursor-on .smooth-cursor { opacity: 0; }

  /* A butterfly resting on a nav button (GlowNav.tsx): settling down onto it, then slowly fanning its wings. */
  @keyframes gnav-land {
    from { opacity: 0; transform: translateY(-16px) scale(0.85); }
    to { opacity: 1; transform: none; }
  }
  @keyframes gnav-fan-r {
    0%, 100% { transform: rotateY(0deg); }
    50% { transform: rotateY(58deg); }
  }
  @keyframes gnav-fan-l {
    0%, 100% { transform: rotateY(0deg); }
    50% { transform: rotateY(-58deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    [style*="gnav-fan"] { animation: none !important; }
  }
  
  * {
    cursor: none !important;
  }

  /* Navbar "V" 3D hover + tiny hi tooltip */
  .v-hi {
    position: relative;
    display: inline-block;
    transform-style: preserve-3d;
    transition: transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1);
    will-change: transform;
    backface-visibility: hidden;
  }

  .v-hi:hover {
    transform: rotateY(180deg) translateZ(8px);
  }

  .v-hi::after {
    content: "hii";
    position: absolute;
    left: 50%;
    top: -1.6em;
    transform: translateX(-50%) translateY(6px);
    opacity: 0;
    pointer-events: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 6px 10px;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.9);
    color: #111827; /* gray-900 */
    border: 1px solid rgba(17, 24, 39, 0.12);
    box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    transition: opacity 180ms ease, transform 180ms ease;
    backface-visibility: hidden;
  }

  html.dark .v-hi::after {
    background: rgba(2, 0, 5, 0.85);
    color: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 10px 26px rgba(0,0,0,0.45);
  }

  .v-hi:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @keyframes fire-flicker {
    0% {
      filter: drop-shadow(0 0 3px rgba(196, 181, 253, 0.8)) drop-shadow(0 -2px 5px rgba(182,157,248, 0.6));
      -webkit-text-stroke-color: #c8b6ff;
    }
    25% {
       filter: drop-shadow(0 0 5px rgba(221, 214, 254, 0.8)) drop-shadow(0 -4px 8px rgba(157, 134, 233, 0.6));
      -webkit-text-stroke-color: #c4b5fd;
    }
    50% {
       filter: drop-shadow(0 0 3px rgba(167, 139, 250, 0.8)) drop-shadow(0 -3px 6px rgba(182,157,248, 0.6));
      -webkit-text-stroke-color: #b69df8;
    }
    75% {
       filter: drop-shadow(0 0 6px rgba(233, 213, 255, 0.8)) drop-shadow(0 -5px 10px rgba(157, 134, 233, 0.6));
      -webkit-text-stroke-color: #c8b6ff;
    }
    100% {
      filter: drop-shadow(0 0 3px rgba(196, 181, 253, 0.8)) drop-shadow(0 -2px 5px rgba(182,157,248, 0.6));
      -webkit-text-stroke-color: #c8b6ff;
    }
  }

  .fire-outline {
    color: transparent;
    -webkit-text-stroke-width: 2px;
    animation: fire-flicker 2.5s infinite linear;
  }

  .cap-title {
    color: rgba(255,255,255,0.85);
    transition: color .3s ease, -webkit-text-stroke-color .3s ease, filter .3s ease;
    -webkit-text-stroke: 2px transparent;
  }
  .cap-item:hover .cap-title {
    color: transparent;
    -webkit-text-stroke: 2px #c8b6ff;
    filter: drop-shadow(0 0 28px rgba(182,157,248,0.55));
  }

  /* Picture showing through the hero letters, slowly panning. */
  .hero-fill-letter {
    background-position: var(--bx, 0px) 20%;
    animation: hero-fill-pan 24s ease-in-out infinite alternate;
  }
  @keyframes hero-fill-pan {
    from { background-position: var(--bx, 0px) 15%; }
    to { background-position: calc(var(--bx, 0px) - var(--pan, 0px)) 85%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-fill-letter { animation: none; }
  }


  /* ---------- Pastel theme (html without .dark) ----------
     The palette of three Pantone swatches, used exactly:
       Soft Lavender 7443 C  #EBDEFC  (main)    ink #743BBE
       Summer Green  317 C   #B1E4E3  (second)  ink #08746B
       Limencello    122 C   #FED141  (third)   ink #3F260C
     Body text is a deep lavender (#2A1650). The site was built dark, so classes like text-white or bg-[#07040f]
     are remapped here; white text on a dark background (bg-black...) is left alone. Sections opt into a colour
     block with .pastel-green. The dark theme ignores all of this. */
  html:not(.dark) {
    --p-lav: #EBDEFC;
    --p-green: #B1E4E3;
    --p-yellow: #FED141;
    --p-lav-ink: #743BBE;
    --p-green-ink: #08746B;
    --p-yellow-ink: #3F260C;
    --p-text: #2A1650;
    --accent: #743BBE;
    --accent-rgb: 116,59,190;
    --accent-35: rgba(116,59,190,0.35);
    --accent-60: rgba(116,59,190,0.6);
    --separator-color: #743BBE;

    /* Hero name (HeroName.tsx): the lavender ink, like the purple PANTONE lettering on the lavender swatch */
    --hn-face: radial-gradient(120% 90% at 18% 0%, rgba(255,255,255,0.28), transparent 55%), linear-gradient(165deg, #9466D6 0%, #8148C8 38%, #743BBE 70%, #6631AF 100%);
    --hn-slab-top: #5B2CA0;
    --hn-slab-bottom: #2A1150;
    --hn-slab-lip: #A983E0;
    --hn-stroke: rgba(235,222,252,0.55);
    --hn-shadow: rgba(70,30,130,0.35);
    --hn-shadow-core: rgba(52,21,95,0.6);
    --hn-floor-line: rgba(116,59,190,0.09);
    --hn-floor-glow: rgba(116,59,190,0.06);

    /* Hero stickers (HeroStickers.tsx): the three swatches with their inks. The ones lying on the purple letters
       are the light swatches; "Ship it" on the floor is the ink. */
    --st-engineer: #FED141;
    --st-engineer-ink: #3F260C;
    --st-human: #EBDEFC;
    --st-human-ink: #743BBE;
    --st-ship: #743BBE;
    --st-ship-ink: #FFFFFF;
    --st-rag: #B1E4E3;
    --st-rag-ink: #08746B;
    --st-rag-lens: #743BBE;

    /* About page tape band (AboutCollage.tsx) */
    --tape-bg: #743BBE;
    --tape-ink: #EBDEFC;
    --tape-star-a: #FED141;
    --tape-star-b: #B1E4E3;
  }

  /* ---------- Loading screen: the signature intro ----------
     Shown from the first byte (plain HTML, before any JavaScript), so there's never a blank or half-styled page.
     The wordmark below (logo/svg/vardhan-wordmark-*.svg: VARDHAN, a rule, SAI RAGHAVENDRA NEHRU) stands on its own.
     On the first visit of a session public/loader/vardhan-loader.js plays the story over it: the face appears as
     one thread, which unwinds onto a loading bar (sitting where the wordmark's rule is) as the site really loads;
     at 100% the face is gone, the bar is the rule, and VARDHAN rises out of it. Once the site is ready the screen
     opens from the middle (--pl-r). */
  @property --pl-r { syntax: '<length>'; inherits: false; initial-value: 0px; }
  #preloader {
    --pl-bg: #EBDEFC; --pl-bg2: #F6F0FE; --pl-ink: #2A1650; --pl-sub: rgba(42,22,80,0.62);
    position: fixed; inset: 0; z-index: 2147483000;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 46%, var(--pl-bg2) 0%, var(--pl-bg) 64%);
    color: var(--pl-ink);
    --pl-r: 0px;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent calc(var(--pl-r) - 1px), #000 var(--pl-r));
    mask-image: radial-gradient(circle at 50% 50%, transparent calc(var(--pl-r) - 1px), #000 var(--pl-r));
    transition: --pl-r .85s cubic-bezier(0.7, 0, 0.18, 1);
  }
  html.dark #preloader { --pl-bg: #07040f; --pl-bg2: #150c2b; --pl-ink: #EDE7FF; --pl-sub: rgba(237,231,255,0.58); }
  #preloader .pl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* --pl-shift: the story moves the wordmark down so its rule (the loading bar) sits under the face, then glides
     it back to the middle as the name rises. */
  #preloader .pl-brand { position: relative; width: min(82vw, 600px); transform: translate3d(0, var(--pl-shift, 0px), 0); transition: transform .65s cubic-bezier(0.65, 0, 0.25, 1), opacity .4s ease; }
  #preloader .pl-mark { display: block; width: 100%; height: auto; overflow: visible; }
  #preloader .pl-mark path { fill: currentColor; }
  #preloader .pl-mark .pl-l { fill-rule: evenodd; }
  #preloader .pl-mark .pl-subt { fill: var(--pl-sub); }
  /* The story: letters wait below the rule (clipped there) and rise out of it once .pl-name is set. */
  #preloader.pl-story .pl-l { transform: translate3d(0, 440px, 0); transition: transform .55s cubic-bezier(0.2, 0.85, 0.25, 1); transition-delay: calc(var(--i) * 35ms); }
  #preloader.pl-story .pl-rule { opacity: 0; }
  #preloader.pl-story .pl-subt { opacity: 0; transform: translate3d(0, -60px, 0); transition: opacity .45s ease .25s, transform .5s cubic-bezier(0.2, 0.85, 0.25, 1) .2s; }
  #preloader.pl-story.pl-name .pl-l { transform: none; }
  #preloader.pl-story.pl-name .pl-rule { opacity: 1; }
  #preloader.pl-story.pl-name .pl-subt { opacity: 1; transform: none; }
  #preloader.pl-out { --pl-r: 150vmax; pointer-events: none; }
  #preloader.pl-out .pl-brand { opacity: 0; transform: scale(1.05); transition-delay: 0s; }
  /* No @property (older browsers): the opening can't animate, so it fades instead. */
  #preloader.pl-nomask { -webkit-mask-image: none; mask-image: none; transition: opacity .7s ease .15s; }
  #preloader.pl-nomask.pl-out { opacity: 0; }
  #preloader .pl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Shown only if the site hasn't started after 8 s (a failed download, say). */
  #preloader .pl-stall { position: absolute; left: 50%; bottom: max(9vh, 48px); transform: translateX(-50%); display: flex; align-items: center; gap: 14px; font: 500 13px/1.3 'Inter', system-ui, sans-serif; color: var(--pl-sub); white-space: nowrap; }
  #preloader .pl-stall[hidden] { display: none; }
  #preloader .pl-stall button { font: inherit; color: var(--pl-ink); background: transparent; border: 1px solid currentColor; border-radius: 999px; padding: 7px 16px; cursor: pointer; }
  html.is-loading, html.is-loading body { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) {
    #preloader { -webkit-mask-image: none; mask-image: none; transition: opacity .4s ease; }
    #preloader.pl-out { opacity: 0; }
    #preloader .pl-brand { transition: opacity .3s ease; }
    #preloader.pl-out .pl-brand { transform: none; }
  }
