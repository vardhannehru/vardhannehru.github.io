<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #b1e4e3;
    }
    #pipe-grain {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    /* One step word at a time, swapped on the same spot. */
    .pipe-step {
      position: absolute;
      left: 150px;
      top: 110px;
      font-family: 'Inter', sans-serif;
    }
    .pipe-step h2 {
      font-weight: 900;
      font-size: 110px;
      line-height: 1;
      letter-spacing: -0.035em;
      color: #08746b;
    }
    .pipe-step p {
      margin-top: 18px;
      font-size: 38px;
      color: #0e1523;
    }
    .pipe-step .n {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.16em;
      color: #08746b;
      margin-bottom: 10px;
    }
    /* Site pages as paper, each made of four chunks */
    .pipe-sheet {
      position: absolute;
      top: 440px;
      width: 290px;
    }
    .pipe-strip {
      position: relative;
      height: 104px;
      background: #ffffff;
      padding: 18px 22px;
      box-shadow: 0 18px 30px -18px rgba(8, 116, 107, 0.55);
    }
    .pipe-strip:first-child {
      border-radius: 14px 14px 0 0;
    }
    .pipe-strip:last-child {
      border-radius: 0 0 14px 14px;
    }
    .pipe-strip b {
      display: block;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 36px;
      letter-spacing: -0.02em;
      color: #0e1523;
    }
    .pipe-strip i {
      display: block;
      height: 12px;
      border-radius: 6px;
      background: #dfe4eb;
      margin-top: 12px;
    }
    #pipe-index {
      position: absolute;
      left: 1250px;
      top: 400px;
      width: 560px;
      height: 520px;
      border-radius: 26px;
      background: #ffffff;
      box-shadow: 0 30px 60px -28px rgba(8, 116, 107, 0.6);
    }
    #pipe-index .lab {
      position: absolute;
      left: 34px;
      top: 28px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.14em;
      color: #08746b;
    }
    .pipe-dot {
      position: absolute;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border-radius: 50%;
      background: #08746b;
    }
    #pipe-query {
      position: absolute;
      left: 1250px;
      top: 262px;
      padding: 18px 26px;
      border-radius: 18px;
      background: #743bbe;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: #ffffff;
    }
    #pipe-qdot {
      position: absolute;
      left: 0;
      top: 0;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: #743bbe;
      border: 6px solid #ffffff;
    }
    #pipe-lines {
      position: absolute;
      inset: 0;
    }
  </style>
  <div id="root" data-composition-id="pipeline" data-width="1920" data-height="1080">
    <div id="pipe-grain"></div>

    <div id="pipe-s1" class="pipe-step"><p class="n">01</p><h2>Ingest</h2><p>Company content, loaded in.</p></div>
    <div id="pipe-s2" class="pipe-step"><p class="n">02</p><h2>Chunk</h2><p>Split into passages.</p></div>
    <div id="pipe-s3" class="pipe-step"><p class="n">03</p><h2>Embed</h2><p>Each chunk becomes a vector.</p></div>
    <div id="pipe-s4" class="pipe-step"><p class="n">04</p><h2>Retrieve</h2><p>The closest chunks are found.</p></div>

    <div id="pipe-sheet-0" class="pipe-sheet" style="left: 150px">
      <div class="pipe-strip"><b>Products</b></div>
      <div class="pipe-strip"><i style="width: 90%"></i><i style="width: 70%"></i></div>
      <div class="pipe-strip"><i style="width: 80%"></i><i style="width: 92%"></i></div>
      <div class="pipe-strip"><i style="width: 66%"></i><i style="width: 84%"></i></div>
    </div>
    <div id="pipe-sheet-1" class="pipe-sheet" style="left: 490px">
      <div class="pipe-strip"><b>Training</b></div>
      <div class="pipe-strip"><i style="width: 86%"></i><i style="width: 74%"></i></div>
      <div class="pipe-strip"><i style="width: 92%"></i><i style="width: 64%"></i></div>
      <div class="pipe-strip"><i style="width: 70%"></i><i style="width: 88%"></i></div>
    </div>
    <div id="pipe-sheet-2" class="pipe-sheet" style="left: 830px">
      <div class="pipe-strip"><b>About</b></div>
      <div class="pipe-strip"><i style="width: 78%"></i><i style="width: 90%"></i></div>
      <div class="pipe-strip"><i style="width: 88%"></i><i style="width: 68%"></i></div>
      <div class="pipe-strip"><i style="width: 74%"></i><i style="width: 82%"></i></div>
    </div>

    <div id="pipe-index"><p class="lab">AZURE AI SEARCH</p></div>
    <svg id="pipe-lines" viewBox="0 0 1920 1080" data-layout-ignore></svg>
    <div id="pipe-query">What AI training do you offer?</div>
    <div id="pipe-qdot"></div>
  </div>
  <script>
    (function () {
      const root = document.getElementById('pipe-index').parentElement;
      const NS = 'http://www.w3.org/2000/svg';
      // The index: one dot per chunk, a row per page (Products, Training, About).
      const dotAt = (s, k) => ({ x: 1250 + 100 + k * 120, y: 400 + 170 + s * 130 });
      const dots = [];
      for (let s = 0; s < 3; s++)
        for (let k = 0; k < 4; k++) {
          const d = document.createElement('div');
          d.className = 'pipe-dot';
          const p = dotAt(s, k);
          d.style.left = p.x + 'px';
          d.style.top = p.y + 'px';
          root.insertBefore(d, document.getElementById('pipe-lines'));
          dots.push(d);
        }
      // The query lands here, among the Training chunks; lines to its three nearest.
      const Q = { x: 1530, y: 600 };
      const near = [4, 5, 6];
      const lines = near.map((i) => {
        const p = dotAt(Math.floor(i / 4), i % 4);
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', Q.x);
        l.setAttribute('y1', Q.y);
        l.setAttribute('x2', p.x);
        l.setAttribute('y2', p.y);
        l.setAttribute('stroke', '#743bbe');
        l.setAttribute('stroke-width', '6');
        l.setAttribute('stroke-linecap', 'round');
        const len = Math.hypot(p.x - Q.x, p.y - Q.y);
        l.setAttribute('stroke-dasharray', len);
        l.setAttribute('stroke-dashoffset', len);
        document.getElementById('pipe-lines').appendChild(l);
        return l;
      });

      const tl = gsap.timeline({ paused: true });
      const stepIn = (id, at) => tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, at);
      const stepOut = (id, at) => tl.to(id, { opacity: 0, filter: 'blur(8px)', duration: 0.15, ease: 'power3.in' }, at);

      // 01 Ingest: the pages drop in.
      stepIn('#pipe-s1', 0.15);
      [0, 1, 2].forEach((s) => {
        tl.fromTo('#pipe-sheet-' + s, { y: -260, rotate: -6 + s * 5, opacity: 0, filter: 'blur(10px)' }, { y: 0, rotate: -2 + s * 2, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out' }, 0.25 + s * 0.14);
      });
      tl.fromTo('#pipe-index', { x: 260, opacity: 0, filter: 'blur(12px)' }, { x: 0, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out' }, 0.7);

      // 02 Chunk: each page splits into its passages.
      stepOut('#pipe-s1', 1.25);
      stepIn('#pipe-s2', 1.4);
      [0, 1, 2].forEach((s) => {
        gsap.utils.toArray('#pipe-sheet-' + s + ' .pipe-strip').forEach((st, k) => {
          tl.to(st, { y: k * 22, x: (k % 2 ? 12 : -8), rotate: (k % 2 ? 1.5 : -1.5), borderRadius: 14, duration: 0.5, ease: 'power3.out' }, 1.5 + s * 0.08 + k * 0.04);
        });
      });

      // 03 Embed: each chunk flies into the index and becomes a dot.
      stepOut('#pipe-s2', 2.45);
      stepIn('#pipe-s3', 2.6);
      [0, 1, 2].forEach((s) => {
        const left = 150 + s * 340;
        gsap.utils.toArray('#pipe-sheet-' + s + ' .pipe-strip').forEach((st, k) => {
          const p = dotAt(s, k);
          const cx = left + 145;
          const cy = 440 + 52 + k * 104 + k * 22;
          const at = 2.7 + (s * 4 + k) * 0.045;
          tl.to(st, { x: p.x - cx, y: p.y - cy + k * 22, scale: 0.12, opacity: 0, duration: 0.45, ease: 'power3.in' }, at);
          tl.fromTo(dots[s * 4 + k], { scale: 0 }, { scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, at + 0.38);
        });
      });

      // 04 Retrieve: the question becomes a point, and finds its nearest chunks.
      stepOut('#pipe-s3', 3.55);
      stepIn('#pipe-s4', 3.7);
      tl.fromTo('#pipe-query', { y: -60, opacity: 0, filter: 'blur(8px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'expo.out' }, 3.65);
      tl.fromTo('#pipe-qdot', { x: 1450, y: 300, scale: 0 }, { x: Q.x, y: Q.y, scale: 1, duration: 0.5, ease: 'power3.inOut' }, 3.95);
      tl.to('#pipe-query', { opacity: 0.35, duration: 0.3 }, 4.15);
      tl.to('.pipe-sheet', { opacity: 0, duration: 0.2 }, 3.7);
      lines.forEach((l, i) => tl.to(l, { attr: { 'stroke-dashoffset': 0 }, duration: 0.3, ease: 'power2.out' }, 4.4 + i * 0.07));
      near.forEach((i, n) => tl.to(dots[i], { backgroundColor: '#fed141', scale: 1.3, duration: 0.25, ease: 'back.out(2)' }, 4.5 + n * 0.07));

      // Out: the lavender world floods back in for the answer.
      tl.to('#root', { backgroundColor: '#ebdefc', duration: 0.4, ease: 'power2.inOut' }, 5.0);
      tl.to('#pipe-s4, #pipe-index, #pipe-lines, #pipe-query, #pipe-qdot, .pipe-dot', { opacity: 0, filter: 'blur(14px)', duration: 0.3, ease: 'power3.in' }, 5.05);
      window.__timelines['pipeline'] = tl;
    })();
  </script>
</template>
