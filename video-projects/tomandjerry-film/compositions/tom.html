  <script>
    (function () {
      // Split the typed lines into letters (a build step, done once).
      document.querySelectorAll('#tom-pane .txt').forEach((el) => {
        el.innerHTML = el.textContent.replace(/\S/g, (c) => '<span class="ch">' + c + '</span>');
      });
      // Waveform bars (fixed heights so every frame is reproducible).
      const wave = document.getElementById('tom-wave');
      const H = [0.35, 0.6, 0.85, 0.5, 0.95, 0.7, 0.4, 0.8, 0.55, 0.9, 0.45, 0.75, 0.6, 0.3, 0.7, 0.5, 0.85, 0.4];
      H.forEach(() => wave.appendChild(document.createElement('span')));

      const tl = gsap.timeline({ paused: true });
      // The pane rises out of the flood.
      tl.fromTo('#tom-pane', { y: 260, opacity: 0, filter: 'blur(14px)', rotate: -2 }, { y: 0, opacity: 1, filter: 'blur(0px)', rotate: 0, duration: 0.7, ease: 'expo.out' }, 0);

      tl.fromTo('#tom-q .lab', { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.6);
      tl.fromTo('#tom-q .ch', { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.024 }, 0.68);
      tl.fromTo('#tom-a .lab', { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.05);
      tl.fromTo('#tom-a .ch', { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.06 }, 2.15);
      tl.fromTo('#tom-cursor', { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.1);
      tl.to('#tom-cursor', { opacity: 0, duration: 0.01, repeat: 7, yoyo: true, repeatDelay: 0.24 }, 2.75);

      // The caption, word by word from light to ink.
      tl.fromTo('#tom-caption .w', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.16, ease: 'power4.out', stagger: 0.07 }, 0.95);

      // Tom's outputs land as a collage.
      tl.fromTo('#tom-cv', { x: 340, rotate: 8, opacity: 0, filter: 'blur(12px)' }, { x: 0, rotate: -5, opacity: 1, filter: 'blur(0px)', duration: 0.65, ease: 'expo.out' }, 1.25);
      tl.fromTo('#tom-voice', { x: 340, rotate: 12, opacity: 0, filter: 'blur(12px)' }, { x: 0, rotate: 4, opacity: 1, filter: 'blur(0px)', duration: 0.65, ease: 'expo.out' }, 1.7);
      tl.fromTo('#tom-board', { x: 340, rotate: 6, opacity: 0, filter: 'blur(12px)' }, { x: 0, rotate: -2, opacity: 1, filter: 'blur(0px)', duration: 0.65, ease: 'expo.out' }, 2.15);
      // The voice talks: each bar swings between two fixed heights.
      gsap.utils.toArray('#tom-wave span').forEach((b, i) => {
        tl.fromTo(b, { scaleY: 0.12 }, { scaleY: H[i], duration: 0.18 + (i % 4) * 0.03, ease: 'sine.inOut', repeat: 9, yoyo: true }, 1.9 + i * 0.015);
      });
      // The application moves along the board.
      tl.to('#tom-job', { x: 179, duration: 0.45, ease: 'power2.inOut' }, 3.0);
      tl.to('#tom-job', { x: 358, duration: 0.45, ease: 'power2.inOut' }, 3.6);

      // Whip into Jerry's world.

      tl.to('#root', { backgroundColor: '#b1e4e3', duration: 0.35, ease: 'power2.inOut' }, 4.35);
      window.__timelines['tom'] = tl;
